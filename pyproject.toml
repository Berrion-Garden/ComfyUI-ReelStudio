[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-reelstudio"
version = "0.1.0"
description = "Reel Studio — a ComfyUI app for YAML-driven MiniMax H3 scene-chain video production"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiohttp>=3.9",
]

[tool.setuptools.packages.find]
include = ["reelstudio*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
