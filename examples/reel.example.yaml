meta:
  comfy: http://localhost:8188
  fps: 24
  frames: 22
  width: 160
  height: 160
  steps: 4
  still_dir: /absolute/path/to/workspace/stills
  reel_dir: /absolute/path/to/workspace/output/reel
  final: /absolute/path/to/workspace/output/final.mp4
  work: /absolute/path/to/workspace/work

aliases:
  fox: the pink fox boy

styles:
  anime:
    pro: 2D anime, cel-shaded, clean bold line art, vibrant flat colors
    con: photorealistic, 3D rendering, live action, text, watermark
  pixar:
    pro: 3D animation, soft global illumination, expressive stylized characters
    con: flat 2D, sketchy lines
style: anime

locations:
  campus_sunset:
    pro: university campus plaza at golden sunset, warm orange sky
    con: indoor, night, rain

stills:
  opening: opening_still
  impact: impact_still
  end: end_still

scenes:
  - id: s1_ramen
    next: s2_bowldrop
    location: campus_sunset
    video:
      mode: i2v
      first: still:opening
      last: null
      description: |
        MCU. The fox eats noodles. {{fox}}.
      negative: text, watermark
    sound_effects:
      soundscape: slurp

  - id: s2_bowldrop
    next: s3_pinkburst
    video:
      mode: i2v
      first: prev_last
      last: null
      description: |
        The fox drops the bowl. {{fox}}.
    sound_effects:
      soundscape: clatter

  - id: s3_pinkburst
    next: null
    video:
      mode: fl2v
      first: still:impact
      last: still:end
      description: |
        Pink explosion. {{fox}}.
